<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="reset.css" />
    <title>Result Summary</title>
  </head>
  <body>
    <main>
      <div class="result-summary">
        <!-- SECTION RESULT -->

        <div class="result">
          <h1 class="result__title">Your result</h1>
          <div class="result__score">
            <p class="result__score--note">
              76 <br />
              <span class="result__score--maximum">of 100</span>
            </p>
          </div>
          <h2 class="mention">Great</h2>
          <p class="mention--evaluation">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>

        <!-- SECTION SUMMARY -->

        <div class="summary">
          <h3 class="summary__title">Summary</h3>

          <div class="summary__grid">
            <div class="summary__item">
              <div class="summary__item--matiere">
                <img
                  src="asset\images\icon-reaction.svg"
                  alt=""
                  class="summary__img"
                />
                <p class="summary__matiere">Reaction</p>
              </div>
              <p class="summary__note">
                80
                <span class="summary__note--maximum">/100</span>
              </p>
            </div>

            <div class="summary__item">
              <div class="summary__item--matiere">
                <img
                  src="asset\images\icon-memory.svg"
                  alt=""
                  class="summary__img"
                />
                <p class="summary__matiere">Memory</p>
              </div>
              <p class="summary__note">
                92
                <span class="summary__note--maximum">/100</span>
              </p>
            </div>

            <div class="summary__item">
              <div class="summary__item--matiere">
                <img
                  src="asset\images\icon-verbal.svg"
                  alt=""
                  class="summary__img"
                />
                <p class="summary__matiere">Verbal</p>
              </div>
              <p class="summary__note">
                61
                <span class="summary__note--maximum">/100</span>
              </p>
            </div>

            <div class="summary__item">
              <div class="summary__item--matiere">
                <img
                  src="asset\images\icon-visual.svg"
                  alt=""
                  class="summary__img"
                />
                <p class="summary__matiere">Visual</p>
              </div>
              <p class="summary__note">
                73
                <span class="summary__note--maximum">/100</span>
              </p>
            </div>

            <button class="summary__button">Continue</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
